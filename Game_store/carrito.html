    <script>
        // Obtener parámetros de la URL
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const product = params.get('product');
            const price = parseFloat(params.get('price'));
            return { product, price };
        }
    
        // Añadir un producto al carrito
        function addProductToCart(product, price) {
            const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
            cartItems.push({ product, price });
            localStorage.setItem('cartItems', JSON.stringify(cartItems));
        }
    
        // Mostrar productos en el carrito
        function displayCartItem() {
            const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
            const cartItemsContainer = document.getElementById('cart-items');
            const totalPriceElement = document.getElementById('total-price');
            let currentTotal = 0;
    
            cartItemsContainer.innerHTML = ''; // Limpiar contenido anterior
    
            cartItems.forEach((item, index) => {
                const cartItemDiv = document.createElement('div');
                cartItemDiv.classList.add('cart-item');
                cartItemDiv.innerHTML = `
                    <div><strong>${item.product}</strong></div>
                    <div class="cart-item-price">$${item.price.toFixed(2)}</div>
                    <button class="btn btn-danger btn-sm" onclick="removeItem(${index})">Eliminar</button>
                `;
                cartItemsContainer.appendChild(cartItemDiv);
                currentTotal += item.price;
            });
    
            totalPriceElement.textContent = currentTotal.toFixed(2);
        }
    
        // Eliminar un producto por su índice
        function removeItem(index) {
            const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
            cartItems.splice(index, 1); // Quitar 1 elemento desde el índice
            localStorage.setItem('cartItems', JSON.stringify(cartItems));
            displayCartItem(); // Actualizar vista
        }
    
        // Añadir producto desde la URL
        function addProductFromUrl() {
            const { product, price } = getUrlParams();
            if (product && !isNaN(price)) {
                addProductToCart(product, price);
    
                // Limpiar los parámetros de la URL para evitar duplicados
                const url = new URL(window.location);
                url.search = '';
                window.history.replaceState({}, '', url);
            }
        }
    
        // Ejecutar funciones
        addProductFromUrl();
        displayCartItem();
    </script>
